
# Set C-SPACE as the control key
set-option -g prefix C-space

# Toggle windows with double <prefix>
bind-key C-space last-window

# Always open new windows next to the current one
bind-key 'c' new-window -a

# Renumber windows when one is closed
set-option -g renumber-windows on

# Mouse settings.
set -g mouse on

# Enable tracking focus events from iTerm2
set -g focus-events on

# Select the pane you clicked when clicking into an unfocused terminal, instead
# of needing a second click. macOS withholds the mouse report for the click that
# activates a window, so tmux never learns where it landed -- no tmux setting and
# no iTerm2 preference can change that (iTerm2 rejects the event on [NSApp
# isActive] before it consults reportOnFirstMouse). The helper recovers the cell
# coordinate from the window server instead. See bin/tmux-select-pane-under-mouse.
#
# Requires `focus-events on` above. Ignores Cmd-Tab, and no-ops off-macOS.
# Debug with: TSPUM_LOG=/tmp/tspum.log
set-hook -g client-focus-in 'run-shell -b "~/.dotfiles/bin/tmux-select-pane-under-mouse #{window_id} #{client_width} #{client_height} --apply"'

# Terminal emulater settings
set -g default-terminal "xterm-256color"
set-window-option -g xterm-keys on

# Scrollback buffer size (number of lines)
set -g history-limit 15000

# Terminal titles
set-option -g set-titles on

# Screen index
set -g pane-base-index 1

# Brief pause so split escape sequences (e.g. ESC-prefixed option+arrow)
# aren't misread as a lone ESC keypress; 10ms is imperceptible for vim ESC.
set -sg escape-time 10

# window split
bind - split-window -h -c "#{pane_current_path}"
bind \= split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded .tmux.conf"

# Synchronize panes
bind e setw synchronize-panes

# window list options
setw -g automatic-rename on

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# status bar colors
set -g status-bg black
set -g status-fg white

# Non-powerline menu bar
#if-shell '[ "true" != "$IS_DEVENV" ]' ' \
#    set-option -g status-justify centre; \
#    set-option -g status-left "#[fg=white,bold]#[fg=yellow,bold]#(hostname) "; \
#    set-option -g status-left-length 60; \
#    set-window-option -g window-status-format "#[fg=cyan,dim]#I:#[fg=yellow]#W#[fg=grey,dim]#F"; \
#    set-window-option -g window-status-current-format "#[bg=black](#[fg=cyan,bold]#I:#[fg=red]#W#[fg=dim]#[fg=white])"; \
#    set -g status-right "#[fg=green][#[fg=blue]%Y-%m-%d #[fg=white]%H:%M#[fg=green]]"; \
#'
if-shell '[ "true" != "$IS_DEVENV" ]' ' \
    set-option -g status-justify centre; \
    set-option -g status-left "#[fg=white,bold]#[fg=yellow,bold]%Y-%m-%d"; \
    set-option -g status-left-length 60; \
    set-window-option -g window-status-format "#[fg=cyan,dim]#I:#[fg=yellow]#W#[fg=grey,dim]#F"; \
    set-window-option -g window-status-current-format "#[bg=black](#[fg=cyan,bold]#I:#[fg=red]#W#[fg=dim]#[fg=white])"; \
    set -g status-right " "; \
'

# powerline menu bar
# linux: source "/usr/share/powerline/bindings/tmux/powerline.conf"
#  os x: source /usr/local/lib/python2.7/site-packages/powerline/bindings/tmux/powerline.conf
if-shell 'if [ "true" = "$IS_DEVENV" ] && [ "" = "$(ps aux | grep powerline-daemon | grep -v grep)" ]; then true; else false; fi' \
    'run-shell "powerline-daemon -q"'
if-shell 'if [ "true" = "$IS_DEVENV" ]; then true; else false; fi' \
    'source "/usr/local/powerline/powerline.conf"'
